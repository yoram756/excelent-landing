# Excelent landing pages. Separate from n8n and OpenClaw. Traefik picks it up by labels.
services:
  lp:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./site:/site:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/lp1-site.inc:/etc/nginx/conf.d/lp1-site.inc:ro
      - ./deploy/lp1-api.inc:/etc/nginx/conf.d/lp1-api.inc:ro
      - /docker/lp-secrets:/etc/nginx/secrets:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.lp1stg.rule=Host(`lp1-stg.srv1604140.hstgr.cloud`)
      - traefik.http.routers.lp1stg.entrypoints=websecure
      - traefik.http.routers.lp1stg.tls.certresolver=letsencrypt
      - traefik.http.services.lp1stg.loadbalancer.server.port=80
      - traefik.http.routers.lp1prod.rule=Host(`refi.excelentfinance.com`)
      - traefik.http.routers.lp1prod.entrypoints=websecure
      - traefik.http.routers.lp1prod.tls.certresolver=letsencrypt
      - traefik.http.routers.lp1prod.service=lp1stg
      - traefik.http.routers.lp1stg.service=lp1stg
