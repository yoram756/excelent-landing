# Excelent landing pages. Static files plus a proxy for the lead form.
limit_req_zone $binary_remote_addr zone=leads:1m rate=6r/m;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Test host, password protected
server {
  listen 80;
  server_name lp1-stg.srv1604140.hstgr.cloud;
  auth_basic "Excelent test";
  auth_basic_user_file /etc/nginx/secrets/htpasswd;
  root /site/lp1v2;
  include /etc/nginx/conf.d/lp1-site.inc;
  # Access protection does not isolate data. Keep test submissions local until
  # a separate, verified sandbox backend exists.
  location ^~ /api/ {
    default_type application/json;
    return 503 '{"error":"staging_intake_not_connected"}';
  }
}

# Public host for the campaign
server {
  listen 80 default_server;
  server_name refi.excelentfinance.com;
  root /site/lp1v2;
  include /etc/nginx/conf.d/lp1-site.inc;
  include /etc/nginx/conf.d/lp1-api.inc;
  # Exact homepage/thank-you routes and isolated assets for the React build.
  # LP1 v2 legal/partner pages and operational API routes stay available.
  include /site/refi-cro/nginx-site.inc;
}
