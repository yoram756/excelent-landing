# NOT DEPLOYED. Requires verified callbacks, a secure owner-populated key file,
# current VPS resource/network review and explicit approval before public routing.
services:
  textme-oauth-read:
    image: ${TEXTME_AUTH_IMAGE:?verified image required}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    env_file: [private-config.env]
    environment:
      TEXTME_AUTH_BIND: 0.0.0.0
      TEXTME_AUTH_PORT: 8790
      TEXTME_CALLER_KEY_FILE: /run/secrets/textme_caller_key
    volumes:
      - ./state:/var/lib/textme-auth
      - ./caller-key:/run/secrets/textme_caller_key:ro
    # Intentionally no published ports, OAuth management or generic RPC ingress.
    networks: [approved-proxy]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8790/textme-dot/healthz',{headers:{host:process.env.TEXTME_AUTH_PUBLIC_BASE?new URL(process.env.TEXTME_AUTH_PUBLIC_BASE).host:'invalid','x-forwarded-proto':'https'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Public routing labels are deliberately absent until the access review.
networks:
  approved-proxy:
    external: true
    name: ${TEXTME_PROXY_NETWORK:?verified existing network required}
