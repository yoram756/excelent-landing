name: Funnel and landing quality gate
on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'site/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - 'scripts/verify.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/funnel-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install nginx for isolated proxy tests
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Validate funnel logic, accessibility and browser flows
        run: npm test
